<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – Uživatelé</title>
  
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="/css/mobile.css">

   <script src="/api/js/api.js" defer></script>
  <script src="/admin/js/users_admin.js" defer></script>
</head>
<body class="admin-page">

<div id="adminHeader"></div>

<main class="auth-container">

    <section class="admin-card">
        <h2>Web účty</h2>

        <div class="users-toolbar">
            <div class="users-search">
                <input id="usersSearch" type="search"
                       placeholder="Hledat e-mail / web ID / game login / postavu / charId…"
                       autocomplete="off">
                <button id="usersSearchClear" type="button" title="Vymazat">×</button>
            </div>
            <div class="users-filters" id="usersFilters">
                <button class="chip chip-online" data-filter="online"><span class="chip-dot"></span>Online</button>
                <button class="chip" data-filter="verified">Ověření</button>
                <button class="chip" data-filter="unverified">Neověření</button>
                <button class="chip" data-filter="admin">Admin</button>
                <button class="chip" data-filter="twofa">2FA</button>
                <button class="chip" data-filter="has_premium">Premium aktivní</button>
                <button class="chip" data-filter="no_game_account">Bez game účtu</button>
                <button class="chip" data-filter="multi_account">Multi-účet (2+)</button>
            </div>
            <div class="users-sort">
                <span class="sort-label">Seřadit:</span>
                <select id="usersSort">
                    <option value="id">ID</option>
                    <option value="email">E-mail (A→Z)</option>
                    <option value="created_at">Registrace</option>
                    <option value="last_access_ms">Poslední aktivita</option>
                    <option value="game_account_count">Počet game účtů</option>
                    <option value="character_count">Počet postav</option>
                    <option value="vc_balance">Vote Coins</option>
                    <option value="dc_balance">Dragon Coins</option>
                </select>
                <button id="usersSortDir" type="button" title="Změnit směr třídění">↓ od největšího</button>
            </div>
            <div class="users-stats" id="usersStats"></div>
        </div>

        <div id="webUsersTree" class="admin-tree">
            <!-- plní users_admin.js -->
        </div>

    </section>

</main>

<script>
fetch('/admin/partials/admin_header.html')
  .then(r => r.text())
  .then(html => {
    document.getElementById('adminHeader').innerHTML = html;

    // 🔥 zvýraznění aktivní stránky
    const links = document.querySelectorAll('.admin-nav a');
const currentFile = window.location.pathname.split("/").pop();

links.forEach(link => {
  const linkFile = link.getAttribute('href').split("/").pop();

  if (currentFile === linkFile) {
    link.classList.add('active');
  }
});
  });
</script>


</body>

</html>
